<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8cc075;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:6px;left:6px;right:6px;z-index:5;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.hrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{pointer-events:auto;background:rgba(28,34,46,.92);color:#fff;border-radius:11px;padding:6px 9px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);border:0}
.chip small{font-weight:600;color:#aeb8c6;font-size:10px;letter-spacing:.5px}
.chip.name{background:#f4c84a;color:#222}
.chip.gold{box-shadow:0 0 0 2px #f4c84a inset}
.spd{display:flex;background:rgba(28,34,46,.92);border-radius:11px;padding:3px;gap:2px;pointer-events:auto}
.spd button{border:0;background:none;color:#fff;font-size:13px;font-weight:800;padding:4px 8px;border-radius:8px}
.spd button.on{background:#f4c84a;color:#222}
#bar{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;gap:6px;padding:6px;overflow-x:auto;background:rgba(28,34,46,.94);touch-action:pan-x}
#bar button{flex:0 0 auto;border:0;border-radius:12px;background:#2c3646;color:#fff;font-weight:700;font-size:13px;padding:9px 11px;display:flex;align-items:center;gap:6px}
#bar button.on{background:#f4c84a;color:#222}
#bar button span{font-size:18px}
#panel{position:fixed;left:6px;right:6px;bottom:62px;max-height:48vh;overflow:auto;z-index:6;background:rgba(28,34,46,.96);color:#fff;border-radius:16px;padding:12px;display:none;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.35);touch-action:pan-y}
@media(max-width:560px){.chip{padding:5px 7px;font-size:12px}.chip small{display:none}.chip.name{display:none}.spd button{padding:3px 6px;font-size:12px}#hud{gap:4px}}
@media(min-width:760px){#panel{left:auto;width:380px;top:110px;bottom:auto;max-height:calc(100vh - 190px)}}
#panel h3{margin:0 0 8px;font-size:15px;color:#f4c84a;letter-spacing:.5px}
.items{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;touch-action:pan-x}
@media(min-width:760px){.items{flex-wrap:wrap}}
.item{flex:0 0 86px;background:#2c3646;border-radius:12px;padding:8px 4px;text-align:center;border:2px solid transparent}
.item.sel{border-color:#f4c84a;background:#3a4659}.item.poor{opacity:.45}
.item .e{font-size:26px}.item .n{font-size:11px;margin-top:3px;line-height:1.2}.item .p{font-size:11px;color:#8fe39b;margin-top:2px}
.row{display:flex;gap:8px;margin-top:10px}
.b{flex:1;padding:10px;border:0;border-radius:10px;background:#2c3646;color:#fff;font-size:13px;font-weight:700}
.b.go{background:#2e9e5b}.b.red{background:#b8433b}.b.y{background:#f4c84a;color:#222}
.hint{font-size:12px;color:#aeb8c6;margin-top:8px;line-height:1.4}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2c3646}
.srow .e{font-size:28px}.srow .t{flex:1}.srow small{color:#aeb8c6}
.srow button{width:42px;height:38px;border:0;border-radius:9px;font-size:19px;font-weight:800;color:#fff}
.star{color:#f4c84a}
.dist{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.dist .bar{flex:1;height:6px;background:#3a4659;border-radius:3px;overflow:hidden}.dist .bar i{display:block;height:100%;background:#57c26a}
.cmp{display:flex;justify-content:space-between;background:#2c3646;border-radius:10px;padding:9px 11px;margin:6px 0}
.cmp b{color:#ff6b6b}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 3px;text-align:left;border-bottom:1px solid #2c3646}
th{color:#f4c84a;font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.goal{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #2c3646}
.goal.done{opacity:.5}
#toast{position:fixed;bottom:70px;left:8px;right:8px;z-index:7;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px}
#toast div{background:rgba(28,34,46,.93);color:#fff;padding:9px 14px;border-radius:14px;font-size:13px;max-width:560px;transition:opacity .5s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal .box{background:#1c2230;color:#fff;border-radius:18px;padding:22px;max-width:440px;width:100%;font-size:14px;line-height:1.5;max-height:90vh;overflow:auto}
#modal h1{margin:0 0 6px;font-size:23px}
#modal ul{padding-left:18px;margin:8px 0}

#hud{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;top:4px;left:4px;right:4px;gap:4px;pointer-events:auto;scrollbar-width:none}
#hud::-webkit-scrollbar{display:none}
.hrow{flex-wrap:nowrap;gap:4px}
.chip{padding:4px 7px;font-size:11.5px;border-radius:9px}.chip small,.chip.name{display:none}
.spd{padding:2px;border-radius:9px}.spd button{padding:2px 6px;font-size:11px}
#bar{padding:4px;gap:4px}#bar button{padding:5px 9px;font-size:11.5px;border-radius:9px;gap:4px}#bar button span{font-size:14px}
#panel{left:auto;right:4px;width:330px;top:38px;bottom:auto;max-height:calc(100vh - 86px);padding:10px;font-size:13px}
.items{flex-wrap:wrap}.item{flex:0 0 74px;padding:5px 3px}.item .e{font-size:21px}
#toast{bottom:48px}#toast div{padding:6px 11px;font-size:12px}

</style>

function acc(o){if(TYPES[o.type].noacc)return null;const n=o.sz,k=Math.floor(n/2);return[[o.x+k,o.y+n],[o.x-1,o.y+k],[o.x+k,o.y-1],[o.x+n,o.y+k]][o.dir];}

function bfs(sx,sy){

const tile=e=>[Math.floor(e.x),Math.floor(e.y)];

/* ================= building ================= */
function canPlace(type,x,y,dir){
  const t=TYPES[type],n=t.sz;
  if(t.air){for(let j=0;j<n;j++)for(let i=0;i<n;i++){const X=x+i,Y=y+j;if(!inZone(X,Y))return'Bouw dit op het groene platformterrein links van de landingsbaan';const q=agAt(X,Y);if(q)return q===RW2TILE?'Hier ligt landingsbaan 2':'Hier is geen plaats';}return null;}
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){const X=x+i,Y=y+j;if(kind(X,Y)=='floor'&&!owned(Y))return'Deze grond is nog niet van jou — koop hem via 🗺️ Uitbreiden';if(kind(X,Y)!='floor'||S.grid[Y][X]||isEntrance(X,Y))return'Hier is geen plaats';}
  if(type=='gate'&&x!=AX)return'Een gate moet tegen het platform (linkerrand)';
  const tmp={type,x,y,dir,sz:n},a=acc(tmp);
  if(a&&(kind(a[0],a[1])!='floor'||!owned(a[1])||S.grid[a[1]][a[0]]))return'De ingang (gele pijl) is geblokkeerd';
  for(const o of S.objs){const q=acc(o);if(q&&q[0]>=x&&q[0]<x+n&&q[1]>=y&&q[1]<y+n)return'Je blokkeert de ingang van iets anders';}
  for(let j=0;j<n;j++)for(let i=0;i<n;i++)S.grid[y+j][x+i]=tmp;
  const reach=new Uint8Array(GW*GH);for(const ti of ownedTerms()){const bb=bfs(GW-1,TERMS[ti].door[0]);for(let k=0;k<GW*GH;k++)if(bb.dist[k]>=0)reach[k]=1;}
  for(let j=0;j<n;j++)for(let i=0;i<n;i++)S.grid[y+j][x+i]=null;
  for(const o of S.objs){const q=acc(o);if(q&&!reach[q[1]*GW+q[0]])return'Dit blokkeert de looproute';}
  if(a&&!reach[a[1]*GW+a[0]])return'Dit blokkeert de looproute';

}
function anchor(type,tx,ty){const n=TYPES[type].sz,k=Math.floor((n-1)/2);return[type=='gate'?AX:tx-k,ty-k];}
function place(type,x,y,dir,free){

/* ================= staff ================= */
function hire(k){S.staff.push({kind:k,x:GW-.5,y:DOOR_Y[ri(0,1)]+.5,state:'idle',wait:0,path:null,station:null});}
function fire(k){const l=S.staff.filter(s=>s.kind==k);if(!l.length)return;const s=l.find(s=>!s.station)||l[l.length-1];if(s.station){s.station.staff=null;s.station.staffed=false;}S.staff.splice(S.staff.indexOf(s),1);}
function wander(e){const[x,y]=tile(e),o=D.map(d=>[x+d[0],y+d[1]]).filter(([a,b])=>walkable(a,b));if(o.length)e.path=[pick(o)];}
function updStaff(s,dt){
  if(s.blocked){s.blocked=false;if(s.station){s.station.staff=null;s.station=null;}s.claim=null;s.wc=null;s.state='idle';}
  if(s.kind=='cleaner')return updCleaner(s,dt);

  if(s.state=='work')return;
  if(s.path)move(s,dt,1.2);

  const type=s.kind=='agent'?'checkin':'security',[sx,sy]=tile(s),b=bfs(sx,sy);let best=null,bd=1e9;
  for(const o of S.objs){if(o.type!=type||o.staff)continue;const a=acc(o),d=b.dist[a[1]*GW+a[0]];if(d>=0&&d<bd){bd=d;best=o;}}
  if(best){const o=best,a=acc(o);o.staff=s;s.station=o;s.state='walk';s.path=pathFrom(b,a[0],a[1]);s.onArrive=()=>{if(o.dead||o.staff!==s){s.state='idle';s.station=null;return;}s.state='work';o.staffed=true;};}
  else{const ot=termOf(s.y),o2=S.objs.find(o=>o.type==type&&!o.staff&&termOf(o.y)!=ot);if(o2){const d=TERMS[termOf(o2.y)].door;s.x=GW-.5;s.y=d[0]+.5;s.path=null;s.wait=0;}else if(!s.path)wander(s);}
}
function updCleaner(s,dt){
  if(s.state=='walk'){move(s,dt,2.8);return;}
  if(s.state=='clean'){s.wait-=dt;if(s.wait<=0){
      if(s.wc){s.wc.dirt=0;s.wc=null;s.state='idle';s.wait=0;return;}
      const[x,y]=s.claim;if(S.litter[y][x]>0)S.litter[y][x]--;if(S.litter[y][x]>0)s.wait=.7;else{s.claim=null;s.state='idle';s.wait=0;}}return;}
  if(s.path)move(s,dt,1.2);
  s.wait-=dt;if(s.wait>0)return;s.wait=1;
  const[sx,sy]=tile(s),b=bfs(sx,sy);let best=null,bd=1e9;
  const claimed=S.staff.filter(o=>o!==s&&o.claim).map(o=>o.claim.join());
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){if(!S.litter[y][x])continue;const d=b.dist[y*GW+x];if(d>=0&&d<bd&&!claimed.includes(x+','+y)){bd=d;best=[x,y];}}
  if(best){s.claim=best;s.state='walk';s.path=pathFrom(b,best[0],best[1]);s.onArrive=()=>{s.state='clean';s.wait=.7;};return;}
  let wc=null;bd=1e9;
  for(const o of S.objs){if(o.type!='toilet'||o.dirt<3||S.staff.some(c=>c!==s&&c.wc===o))continue;const a=acc(o),d=b.dist[a[1]*GW+a[0]];if(d>=0&&d<bd){bd=d;wc=o;}}
  if(wc){const a=acc(wc);s.wc=wc;s.state='walk';s.path=pathFrom(b,a[0],a[1]);s.onArrive=()=>{if(wc.dead){s.wc=null;s.state='idle';return;}s.state='clean';s.wait=2.5;};return;}
  {const ot=termOf(s.y);for(let y=0;y<GH&&!s.moved;y++){if(termOf(y)==ot||!owned(y))continue;if(S.litter[y].some(v=>v>0)||S.objs.some(o=>o.type=='toilet'&&o.dirt>=3&&termOf(o.y)!=ot&&termOf(o.y)==termOf(y))){const d=TERMS[termOf(y)].door;s.x=GW-.5;s.y=d[0]+.5;s.path=null;s.wait=0;return;}}}
  if(!s.path)wander(s);

/* ================= passengers ================= */
function detach(p){
  const o=p.target;
  if(o&&p.state=='queue'){const i=o.queue.indexOf(p);if(i>=0)o.queue.splice(i,1);const a=acc(o);p.x=a[0]+.5;p.y=a[1]+.5;}
  if(o&&p.state=='serve'){const i=o.serving.findIndex(s=>s.p===p);if(i>=0)o.serving.splice(i,1);const a=acc(o);p.x=a[0]+.5;p.y=a[1]+.5;}
  if(p.seat){const{o:so,i}=p.seat;if(so.seats&&so.seats[i]===p)so.seats[i]=null;if(p.state=='sit'){const a=acc(so);p.x=a[0]+.5;p.y=a[1]+.5;}p.seat=null;}
  p.target=null;p.path=null;p.onArrive=null;
}
function seek(p,types,opt){
  const[sx,sy]=tile(p),b=bfs(sx,sy);let best=null,bs=1e9;
  for(const o of S.objs){if(!types.includes(o.type))continue;const t=TYPES[o.type];if(t.staff&&!o.staffed)continue;const a=acc(o),d=b.dist[a[1]*GW+a[0]];if(d<0)continue;
    const sc=d+(o.queue.length+o.incoming)*4/(SLOTS[o.type]?SLOTS[o.type].length:1)*(t.staff?1.3:1);if(sc<bs){bs=sc;best=o;}}
  if(!best){if(opt)return false;p.state='idle';p.wait=1.5;p.lost=types[0];return true;}
  p.lost=false;const o=best,a=acc(o);p.state='walk';p.target=o;o.incoming++;p.path=pathFrom(b,a[0],a[1]);
  p.onArrive=()=>{if(o.dead){p.target=null;decide(p);return;}o.queue.push(p);p.state='queue';};
  return true;
}
function trySeat(p,o,b){
  const i=o.seats.findIndex(x=>!x);if(i<0)return false;const a=acc(o),pth=pathFrom(b,a[0],a[1]);if(!pth)return false;
  o.seats[i]=p;p.seat={o,i};p.state='walk';p.path=pth;
  p.onArrive=()=>{if(o.dead||o.seats[i]!==p){p.seat=null;decide(p);return;}p.state='sit';p.wait=2;const q=L(o,...SEATS[o.type][i]);p.x=q[0];p.y=q[1];};return true;
}
function decide(p){
  p.path=null;p.onArrive=null;p.target=null;p.blocked=false;
  if(p.state=='leaving')return;
  const f=p.f;
  if(p.stage==0){seek(p,['checkin']);return;}
  if(p.stage==1){seek(p,['security']);return;}
  p.lost=false;
  if(f.state=='boarding'){const a=acc(f.gate);p.state='walk';if(!goTo(p,a[0],a[1],()=>{if(p.f.state=='boarding')board(p);else{p.state='idle';p.wait=1;}})){p.state='idle';p.wait=1;}return;}
  if(p.bladder>70){if(seek(p,['toilet'],true))return;if(p.bladder>100)p.cmp.add('toilet');}
  if(p.hunger>60){if(seek(p,['restaurant','sushi','burger','cafe','vending'],true))return;if(p.hunger>100)p.cmp.add('hungry');}
  if(p.biz&&!p.lounged){p.lounged=true;if(seek(p,['lounge'],true))return;p.cmp.add('lounge');}
  if(!p.shopped&&Math.random()<.35){p.shopped=true;if(seek(p,['shop','dutyfree','pharmacy','tech','atm'],true))return;}
  if(!p.funned&&Math.random()<.25){p.funned=true;if(seek(p,['play','massage'],true))return;}
  const[sx,sy]=tile(p),b=bfs(sx,sy);
  if(trySeat(p,f.gate,b))return;
  let best=null,bd=1e9;for(const o of S.objs){if(o.type!='bench'||!o.seats.some(x=>!x))continue;const a=acc(o),d=b.dist[a[1]*GW+a[0]];if(d>=0&&d<bd){bd=d;best=o;}}
  if(best&&bd<14&&trySeat(p,best,b))return;
  if(S.min>f.dep-70)p.cmp.add('seat');
  const a=acc(f.gate);
  for(let i=0;i<12;i++){const x=a[0]+ri(0,3),y=a[1]+ri(-2,2);if(walkable(x,y)&&b.dist[y*GW+x]>=0){p.state='walk';p.path=pathFrom(b,x,y);p.onArrive=()=>{p.state='idle';p.wait=rnd(2,5);};return;}}
  p.state='idle';p.wait=2;
}
function serve(o,p){
  const a=acc(o),t=TYPES[o.type];p.x=a[0]+.5;p.y=a[1]+.5;p.target=null;
  if(o.type=='checkin')p.stage=1;
  else if(o.type=='security')p.stage=2;
  else if(o.type=='toilet'){p.bladder=0;o.dirt+=[0,1,.6,.35][o.lv||1];if(o.dirt>6){p.mood-=15;p.cmp.add('wc');}else p.mood+=8;}
  else if(t.food){p.hunger=0;p.mood+=10;}
  else if(t.shop||o.type=='lounge')p.mood+=o.type=='lounge'?25:6;
  else if(t.fun)p.mood+=o.type=='play'?20:15;
  if(t.treat)p.treat=true;
  p.mood=Math.min(100,p.mood);
  if(t.earn){const e=earnOf(o);S.money+=e;S.stats.shop+=e;floatTxt(o.x+o.sz/2,o.y+o.sz/2,34,'+€'+e,'#8fe39b');}
  p.state='idle';decide(p);
}
function review(p,force){
  let s;
  if(force)s=1;else{const m=p.mood-(S.level-1)*1.8;s=m>=80?4:m>=60?3:m>=40?2:1;if(p.cmp.size>=2)s=Math.max(1,s-1);if(p.treat&&m>=72&&p.cmp.size==0)s=5;}
  const c=CPRIO.find(k=>p.cmp.has(k))||null;
  S.reviews.push({s,c});if(s==5)addXP(1);if(S.reviews.length>30)S.reviews.shift();
  S.rep+=(avgStars()*20-S.rep)*.06;
}
function avgStars(){if(!S.reviews.length)return 2.5;return S.reviews.reduce((a,r)=>a+r.s,0)/S.reviews.length;}
function board(p){const f=p.f,e=30+(f.c?f.c.fee:0);f.boarded++;S.money+=e;S.stats.boarded++;addXP(1);review(p);floatTxt(p.x,p.y,30,'+€'+e,'#8fe39b');p.gone=true;}
function leave(p){detach(p);p.state='leaving';p.lost=false;if(!goTo(p,GW-1,doorOf(p.y)[ri(0,1)],()=>{p.gone=true;}))p.gone=true;}
function spawnPax(f){
  const p={x:GW-.5,y:f.gate?TERMS[termOf(f.gate.y)].door[ri(0,1)]+.5:DOOR_Y[0]+.5,f,stage:0,state:'idle',wait:0,mood:rnd(78,100),bladder:rnd(0,50),hunger:rnd(0,50),bR:rnd(.6,1.4),hR:rnd(.5,1.2),litterT:rnd(10,40),path:null,
    cmp:new Set(),qt:0,st:0,dirtExp:0,biz:Math.random()<.15,shirt:pick(SHIRTS),skin:pick(SKIN),hair:pick(HAIR),pants:pick(['#2d3436','#34495e','#5d4037','#1e3799','#636e72'])};
  S.pax.push(p);decide(p);
}
function updPax(p,dt){
  const nd=1+(S.level-1)*.04;p.bladder+=dt*p.bR*nd;p.hunger+=dt*p.hR*nd;
  const[tx0,ty0]=tile(p),tx=Math.max(0,Math.min(GW-1,tx0)),ty=Math.max(0,Math.min(GH-1,ty0));
  if(p.state!='leaving'){
    let dm=0;
    if(p.state=='queue'){dm-=.9*DIFF();if(p.target&&p.target.type=='checkin'&&(p.qt+=dt)>25)p.cmp.add('queue');if(p.target&&p.target.type=='security'&&(p.st+=dt)>25)p.cmp.add('sec');}
    if(p.lost)dm-=2.2*DIFF();
    if(p.state=='sit')dm+=2.5;
    dm+=S.decor[ty][tx]*.6;
    let lit=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const r=S.litter[ty+dy];if(r&&r[tx+dx])lit+=r[tx+dx];}
    dm-=Math.min(2,lit*.35);if(lit>=2&&(p.dirtExp+=dt)>6)p.cmp.add('dirty');
    if(p.bladder>110)dm-=1;if(p.hunger>110)dm-=.7;
    p.mood=Math.min(100,p.mood+dm*dt);
    if(p.mood<=0){S.stats.angry++;p.cmp.add('angry');review(p,true);if(S.min-S.lastAngry>60){S.lastAngry=S.min;toast('😡 Een passagier vertrekt woedend! Wachtrijen te lang?');}leave(p);p.angry=true;return;}
    if((p.litterT-=dt)<=0){p.litterT=rnd(15,40);if(Math.random()<.4&&!S.binNear[ty][tx]&&kind(tx,ty)=='floor'&&!S.grid[ty][tx]&&S.litter[ty][tx]<3)S.litter[ty][tx]++;}
  }
  switch(p.state){
    case'walk':move(p,dt,2.4);if(p.blocked){detach(p);decide(p);}break;
    case'leaving':move(p,dt,2.6);if(p.blocked){p.blocked=false;if(!goTo(p,GW-1,doorOf(p.y)[0],()=>{p.gone=true;}))p.gone=true;}break;
    case'idle':p.wait-=dt;if(p.wait<=0)decide(p);break;
    case'sit':p.wait-=dt;if(p.wait<=0){p.wait=2;if(p.f.state=='boarding'||p.bladder>75||p.hunger>65){detach(p);decide(p);}}break;
  }
}

/* ================= airside: zone, runways, taxiways ================= */
const ZX0=-21,ZX1=-8,ZW=ZX1-ZX0,RW1X=-5.3,RW2X=-18.5,LANE=-1.45,RW2_LV=10,RW2_C=60000;
const RW2TILE={type:'rw2'};
const inZone=(x,y)=>x>=ZX0&&x<ZX1&&y>=0&&y<GH;
const agAt=(x,y)=>inZone(x,y)?S.ag[y][x-ZX0]:null;
const isGate=o=>o.type=='gate'||o.type=='busgate';
const hasFire=()=>S.objs.some(o=>o.type=='fire');
const garage=()=>S.objs.find(o=>o.type=='garage');
function zbfs(srcs,pass){
  const N=ZW*GH,dist=new Int16Array(N).fill(-1),prev=new Int32Array(N).fill(-1),q=[];
  for(const[x,y]of srcs){const n=y*ZW+x-ZX0;if(dist[n]<0){dist[n]=0;q.push(n);}}
  let h=0;while(h<q.length){const c=q[h++],cx=c%ZW+ZX0,cy=(c/ZW)|0;for(const[dx,dy]of D){const nx=cx+dx,ny=cy+dy;if(!inZone(nx,ny)||!pass(nx,ny))continue;const n=ny*ZW+nx-ZX0;if(dist[n]>=0)continue;dist[n]=dist[c]+1;prev[n]=c;q.push(n);}}
  return{dist,prev};
}
// tiles from the closest reached tile in column `col` back to a BFS root
function zpath(b,col){let best=-1,bd=1e9;for(let y=0;y<GH;y++){const n=y*ZW+col-ZX0,d=b.dist[n];if(d>=0&&d<bd){bd=d;best=n;}}if(best<0)return null;const p=[];for(let n=best;n>=0;n=b.prev[n])p.push([n%ZW+ZX0,(n/ZW)|0]);return p;}
// route runway -> stand (tile list), cached until the airside layout changes
function standPath(st,rw){
  if(rw==2&&!S.rw2)return null;
  const k='p'+rw;if(st[k]&&st[k].v==S.airV)return st[k].p;
  const src=[];for(let j=0;j<st.sz;j++)for(let i=0;i<st.sz;i++)src.push([st.x+i,st.y+j]);
  const p=zpath(zbfs(src,(x,y)=>{const o=agAt(x,y);return o&&(o.type=='taxi'||o===st);}),rw==1?ZX1-1:ZX0+5);
  st[k]={v:S.airV,p};return p;
}
// route runway 2 -> runway 1
function connPath(){
  if(!S.rw2)return null;if(S.conn&&S.conn.v==S.airV)return S.conn.p;
  const src=[];for(let y=0;y<GH;y++){const o=agAt(ZX1-1,y);if(o&&o.type=='taxi')src.push([ZX1-1,y]);}
  const p=zpath(zbfs(src,(x,y)=>{const o=agAt(x,y);return o&&o.type=='taxi';}),ZX0+5);
  S.conn={v:S.airV,p};return p;
}
const standOK=st=>!!(standPath(st,1)||standPath(st,2));
const rwInc=r=>S.inc.some(i=>i.rw==r);
function rwOK(r){return r==1?!(S.min<S.repairEnd)&&S.runway>=15&&!rwInc(1):!!S.rw2&&!rwInc(2);}
function setRw2(){S.rw2=true;for(let y=0;y<GH;y++)for(let x=ZX0;x<ZX0+5;x++)S.ag[y][x-ZX0]=RW2TILE;S.airV++;}
function buyRw2(){
  if(S.rw2)return;if(S.level<RW2_LV){toast(`🔒 Landingsbaan 2 kan vanaf level ${RW2_LV}`);return;}
  if(S.money<RW2_C){toast(`💸 Niet genoeg geld (${eur(RW2_C)} nodig)`);return;}
  for(let y=0;y<GH;y++)for(let x=ZX0;x<ZX0+5;x++)if(agAt(x,y)){toast('⚠️ Maak eerst de strook helemaal links vrij (5 vakjes breed)');return;}
  S.money-=RW2_C;setRw2();addXP(40);
  showModal(`<h1>🛬 Landingsbaan 2 geopend!</h1><p>Leg nu een <b>taxibaan</b> van baan 2 (links) naar baan 1. Pas dan kunnen vliegtuigen er landen.</p><p>💡 Met twee banen gaan er minder vluchten verloren bij onderhoud of een incident.</p><button class="b y" style="width:100%;padding:12px" onclick="$('modal').style.display='none';focusZone()">📍 Bekijk het platform</button>`);saveGame();
}

/* ================= flight slots & routes ================= */
const PT={S:{n:'Regionaal',adj:'regionale',pax:18,lv:1,sc:1},M:{n:'Middelgroot',adj:'middelgrote',pax:30,lv:3,sc:2},L:{n:'Groot',adj:'grote',pax:45,lv:6,sc:3}};
function slots(){
  const out=[];
  for(const g of S.objs)if(g.type=='gate'&&!g.flight&&!g.plane)out.push({g,cap:GATECAP[g.lv||1]});
  const bgs=S.objs.filter(o=>o.type=='busgate'&&!o.flight).sort((a,b)=>(b.lv||1)-(a.lv||1));
  const sts=S.objs.filter(o=>o.type=='stand'&&!o.plane&&!o.flight&&standOK(o));
  for(let i=0;i<Math.min(bgs.length,sts.length);i++)out.push({g:bgs[i],st:sts[i],cap:GATECAP[bgs[i].lv||1]});
  return out;
}
const slotRws=s=>[1,2].filter(r=>rwOK(r)&&(s.st?!!standPath(s.st,r):r==1||!!connPath()));
function placesTotal(){return S.objs.filter(o=>o.type=='gate').length+Math.min(S.objs.filter(o=>o.type=='busgate').length,S.objs.filter(o=>o.type=='stand'&&standOK(o)).length);}
function arrivalRoute(pl,g,st,rw){
  const X=rw==1?RW1X:RW2X,T=([x,y])=>[x+.5,y+.5,2];let wp,ty;
  if(st){const p=standPath(st,rw);ty=p[0][1]+.5;wp=[[X,ty,7],...p.map(T),[st.x+st.sz/2,st.y+st.sz/2,1.4]];pl.route=p;}
  else{const gy=g.y+1.5,park=[2.75-1.7*pl.sc,gy,1.6];
    if(rw==1){ty=gy;wp=[[X,gy,7],[-2.4,gy,2.2],park];}
    else{const p=connPath(),ey=p[p.length-1][1]+.5;ty=p[0][1]+.5;wp=[[X,ty,7],...p.map(T),[RW1X,ey,2.2],[RW1X,gy,2.2],[-2.4,gy,2.2],park];}}
  pl.x=X;pl.y=ty-26;pl.ang=Math.PI/2;pl.wp=wp;
}
function departRoute(pl,f){
  if(f.stand){const p=pl.route,X=pl.rw==1?RW1X:RW2X,ty=p[0][1]+.5;pl.wp=[...p.slice().reverse().map(([x,y])=>[x+.5,y+.5,1.6]),[X,ty,2],[X,ty+26,8]];pl.g=f.stand;pl.fadeY=ty+12;pl.rev=false;}
  else{const gy=f.gate.y+1.5;pl.wp=[[-2.4,gy,1.4],[RW1X,gy,2.2],[RW1X,gy+26,8]];pl.g=f.gate;pl.fadeY=gy+12;pl.rev=true;}
  pl.state='depart';pl.fade=true;
}

/* ================= flights & planes ================= */
function newFlight(c){
  const al=c?AIRL[c.al]:null,code=c?al.c+c.no:pick(['SN','FR','KL','LH','BA','VY','TB','HV'])+ri(100,999);
  if(![1,2].some(rwOK)){
    if(c)contractMiss(c,'geen landingsbaan vrij');
    else if(S.min<S.repairEnd)toast('🚧 Landingsbaan in onderhoud — vlucht omgeleid');
    else if(rwInc(1))toast('🔥 Landingsbaan dicht door een incident — vlucht omgeleid');
    else{S.rep-=1;toast('🛑 Landingsbaan te beschadigd! Vlucht geweigerd — plan onderhoud (🛬 Platform)');}
    return;}
  if(!S.objs.some(isGate)){if(c)contractMiss(c,'je hebt geen gate');else toast('✈️ Een vlucht wil landen, maar je hebt geen gate!');return;}
  const need=c?PT[c.pt].pax:0,opts=slots().map(s=>({...s,rws:slotRws(s)})).filter(s=>s.rws.length&&s.cap>=need);
  if(!opts.length){if(c)contractMiss(c,need>18?`geen vrije gate ${'★'.repeat(PT[c.pt].sc)} voor een ${PT[c.pt].n.toLowerCase()} toestel`:'alle gates bezet');else toast('✈️ Vlucht geweigerd: alle gates bezet. Bouw er meer!');return;}
  if(!c&&opts.length<=reservedSoon())return; // houd plaats vrij voor geplande vluchten
  const jw=opts.filter(s=>!s.st),sl=jw.length?pick(jw):pick(opts),g=sl.g;
  let pax,sc;
  if(c){pax=Math.min(sl.cap,Math.round(PT[c.pt].pax*rnd(.8,1)*(.85+S.rep/650)));sc=PLSC[PT[c.pt].sc];}
  else{const day=Math.floor(S.min/1440),want=Math.round((5+S.rep/8+day*1.2+rnd(0,4))*(1+(S.level-1)*.09));pax=Math.min(sl.cap,want);sc=PLSC[g.lv||1];
    if(want>sl.cap+3&&S.min-(S.lastBig||-999)>240){S.lastBig=S.min;toast(`✈️ Grotere vliegtuigen willen landen — upgrade je gates (max ${sl.cap} passagiers)`);}}
  const rw=sl.rws.length>1?(Math.random()<.5?1:2):sl.rws[0];
  const f={code,dest:c?c.dest:pick(DESTS),c:c||null,created:S.min,dep:c?S.min-S.min%1440+c.dep:S.min+150,pax,spawned:0,boarded:0,missed:0,gate:g,stand:sl.st||null,color:c?al.col:COLS[S.fc++%COLS.length],state:'open',need:['fuel','bag'],done:{}};
  if(S.level>=VK.cater.lv)f.need.push('cater');if(f.stand)f.need.push('bus');
  const pl={sc,f,color:f.color,state:'arrive',alpha:1,rw,rev:false,inc:S.level>=3&&Math.random()<.015+(rw==1&&S.runway<35?.03:0)};
  arrivalRoute(pl,g,sl.st,rw);
  g.flight=f;if(sl.st){sl.st.flight=f;sl.st.plane=pl;}else g.plane=pl;
  f.plane=pl;S.flights.push(f);S.planes.push(pl);
  toast(`🛬 ${f.code}${c?' ('+al.n+')':''} uit ${f.dest} landt${rw==2?' op baan 2':''} — ${f.stand?'parking P'+f.stand.num+' · busgate '+g.num:'gate '+g.num}, ${pax} passagiers`);
}
function wpReached(pl){
  pl.wp.shift();pl.rev=false;
  if(pl.state=='arrive'&&!pl.landed){pl.landed=true;if(pl.inc)startInc(pl);}
  if(pl.state=='depart'&&pl.wp.length==1&&pl.g){pl.g.plane=null;pl.g=null;}
}
function updPlane(pl,dt){
  if(pl.hold)return;
  if(!pl.wp.length){
    if(pl.state=='arrive'){pl.state='parked';if(!pl.f.stand)pl.ang=0;
      if(pl.rw==1){wearRunway(.7*(pl.sc||1));if(S.runway<35&&S.min-(S.lastBump||-999)>120){S.lastBump=S.min;S.rep-=.5;toast('😬 Hobbelige landing: de landingsbaan is versleten');}}
      for(const k of pl.f.need)if(k!='bus'&&!pl.f.done[k])S.jobs.push({f:pl.f,k});}
    else if(pl.state=='depart')pl.done=true;
    return;}
  const[tx,ty,sp]=pl.wp[0],dx=tx-pl.x,dy=ty-pl.y,d=Math.hypot(dx,dy),st=sp*dt;
  if(d<1e-3){wpReached(pl);return;}
  if(!pl.rev){let da=Math.atan2(dy,dx)-pl.ang;da=Math.atan2(Math.sin(da),Math.cos(da));pl.ang+=da*Math.min(1,dt*(sp>5?20:6));}
  if(d<=st){pl.x=tx;pl.y=ty;wpReached(pl);}else{pl.x+=dx/d*st;pl.y+=dy/d*st;}
  if(pl.state=='depart'&&pl.wp.length==0)pl.done=true;
  if(pl.fade&&pl.y>pl.fadeY)pl.alpha=Math.max(0,pl.alpha-dt*.5);
}
const missing=f=>f.need.filter(k=>!f.done[k]);
function updFlights(){
  for(const f of S.flights){
    if(f.state=='gone')continue;
    while(f.spawned<f.pax&&S.min>=f.created+f.spawned*(90/f.pax)){f.spawned++;spawnPax(f);}
    if(f.state=='open'&&S.min>=f.dep-40&&f.plane.state=='parked'){
      f.state='boarding';if(f.stand&&!f.done.bus)S.jobs.push({f,k:'bus'});
      for(const p of S.pax)if(p.f===f&&p.stage==2&&!p.gone&&(p.state=='idle'||p.state=='sit'||(p.state=='walk'&&!p.target))){detach(p);p.state='idle';decide(p);}
    }
    if(S.min>=f.dep&&f.plane.state!='parked'){f.dep+=10;continue;}
    const miss=missing(f);
    if(S.min>=f.dep&&miss.length&&(f.delays||0)<3){
      f.dep+=15;f.delays=(f.delays||0)+1;S.rep-=1;S.stats.delays=(S.stats.delays||0)+1;
      for(let k=0;k<2;k++){S.reviews.push({s:2,c:'delay'});if(S.reviews.length>30)S.reviews.shift();}
      if(f.c){S.money-=f.c.pen;f.c.sat-=8;satCheck(f.c);}
      for(const k of miss)if(!S.jobs.some(j=>j.f===f&&j.k==k)&&!S.veh.some(v=>v.f===f&&v.k==k))S.jobs.push({f,k});
      const none=miss.filter(k=>!S.veh.some(v=>v.k==k&&v.state!='broken'));
      toast(`⏰ ${f.code} vertraagd: wacht op ${miss.map(k=>VK[k].e+' '+VK[k].n.toLowerCase()).join(', ')}`+(none.length?` — je hebt geen ${VK[none[0]].n.toLowerCase()}!`:freeDrivers()<=0?' — te weinig chauffeurs!':' — koop extra voertuigen'));continue;
    }
    if(S.min>=f.dep){
      if(miss.length)S.rep-=2;if(f.plane.rw==1)wearRunway(.5*(f.plane.sc||1));
      f.state='gone';f.gate.flight=null;if(f.stand)f.stand.flight=null;
      departRoute(f.plane,f);S.jobs=S.jobs.filter(j=>j.f!==f);
      for(const p of S.pax)if(p.f===f&&!p.gone&&p.state!='leaving'){f.missed++;p.cmp.add('missed');review(p,true);leave(p);}
      S.stats.missed+=f.missed;
      if(f.c&&!f.delays){f.c.sat+=3;satCheck(f.c);}
      toast(`🛫 ${f.code} naar ${f.dest} vertrekt: ${f.boarded}/${f.pax} aan boord`+(f.missed?` • ${f.missed} gemist 😞`:' 👍'));
    }
  }
  const gone=S.flights.filter(f=>f.state=='gone');if(gone.length>6)S.flights.splice(S.flights.indexOf(gone[0]),1);
}

/* ================= incidents ================= */
function startInc(pl){
  pl.hold=true;const fire=hasFire();
  S.inc.push({pl,rw:pl.rw,until:S.min+(fire?240:60),truck:null});S.rep-=fire?1:5;S.stats.inc=(S.stats.inc||0)+1;
  toast(fire?`🔥 Motorbrand bij ${pl.f.code}! De brandweer rukt uit — baan ${pl.rw} even dicht`:`🔥 Motorbrand bij ${pl.f.code}! Geen brandweer: baan ${pl.rw} een uur dicht. Bouw een 🚒 brandweerkazerne!`);
}
function endInc(i){i.pl.hold=false;S.inc.splice(S.inc.indexOf(i),1);toast(`✅ Brand bij ${i.pl.f.code} geblust — baan ${i.rw} weer open`);}

/* ================= runway ================= */
function wearRunway(n){S.runway=Math.max(0,S.runway-n*(S.rwLv>1?.5:1));}
const repairCost=()=>Math.round((100-S.runway)*45/10)*10;
function repairRunway(){if(S.min<S.repairEnd){toast('🚧 Onderhoud is al bezig');return;}if(S.runway>97){toast('✨ De landingsbaan is in topvorm');return;}const c=repairCost();if(S.money<c){toast('💸 Niet genoeg geld');return;}
  S.money-=c;S.repairStart=S.min;S.repairFrom=S.runway;S.repairEnd=S.min+45;toast('🚧 Onderhoud gestart — 45 min geen landingen op baan 1');saveGame();}
function reinforceRunway(){if(S.rwLv>1)return;if(S.level<RW_LV){toast(`🔒 Vanaf level ${RW_LV}`);return;}if(S.money<15000){toast('💸 €15.000 nodig');return;}S.money-=15000;S.rwLv=2;S.runway=100;addXP(10);toast('🛬 Landingsbaan versterkt: slijt nu half zo snel!');saveGame();}

/* ================= ground handling vehicles ================= */
const VK={
  fuel:{n:'Tankwagen',e:'⛽',c:1500,t:6,lv:1,col:'#ecf0f1',top:'#e74c3c',d:'Tankt elk vliegtuig'},
  bag:{n:'Bagagetrein',e:'🧳',c:1200,t:7,lv:1,col:'#e67e22',top:'#5d6d7e',d:'Lost en laadt de bagage'},
  cater:{n:'Cateringwagen',e:'🍱',c:1800,t:5,lv:3,col:'#f4f6f7',top:'#2980b9',d:'Brengt maaltijden aan boord'},
  bus:{n:'Platformbus',e:'🚌',c:2500,t:3,lv:4,col:'#2471a3',top:'#d6eaf8',d:'Rijdt reizigers van de busgate naar een vliegtuigparking'},
  fire:{n:'Brandweerwagen',e:'🚒',c:0,t:8,lv:5,col:'#c0392b',top:'#f4d03f'}};
const VOFF={fuel:[-.45,.95],bag:[-1.0,-.85],cater:[.7,-.8],bus:[.9,1.05]};
const VUPK=30,DRV_SAL=90,FIRE_SAL=250,HANGAR_RENT=450,TOW_C=800;
function nearDepot(y){const ds=DEPOT_Y.filter((d,i)=>i==0||S.terms[i]);return ds.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a);}
function newVeh(k,home,cond){const hx=home?home.x+home.sz/2:-1.2,hy=home?home.y+home.sz/2:DEPOT_Y[0]+rnd(-.6,.6);return{k,x:hx,y:hy,state:'idle',wp:[],dir:[0,1],cond:cond===undefined?100:cond,home:home||null,f:null};}
const vBusy=v=>v.k!='fire'&&v.state!='idle'&&v.state!='broken';
const freeDrivers=()=>S.drivers-S.veh.filter(vBusy).length;
function buyVeh(k){const t=VK[k];if(S.level<t.lv){toast(`🔒 ${t.n} vanaf level ${t.lv}`);return;}if(S.money<t.c){toast('💸 Niet genoeg geld');return;}S.money-=t.c;S.veh.push(newVeh(k));if(freeDrivers()<1)toast('👷 Vergeet geen extra chauffeur aan te nemen!');}
function sellVeh(k){const i=S.veh.findIndex(v=>v.k==k&&(v.state=='idle'||v.state=='broken'));if(i<0){toast(`${VK[k].e} Alle ${VK[k].n.toLowerCase()}s zijn onderweg`);return;}S.veh.splice(i,1);S.money+=VK[k].c/2;}
function towAll(){const b=S.veh.filter(v=>v.state=='broken');if(!b.length)return;const c=b.length*TOW_C;if(S.money<c){toast('💸 Niet genoeg geld');return;}
  S.money-=c;for(const v of b){const dp=nearDepot(v.y);v.cond=100;v.state='idle';v.x=-1.2;v.y=dp;v.wp=[];v.trip=null;}toast(`🔧 ${b.length} voertuig(en) hersteld`);}
function vTarget(pl,k){const[u,w]=VOFF[k],s=pl.sc||1,c=Math.cos(pl.ang),n=Math.sin(pl.ang);return[pl.x+(u*c-w*n)*s,pl.y+(u*n+w*c)*s];}
function pathTo(v,tx,ty,st){
  const wp=[[LANE,v.y]],p=st&&standPath(st,1);
  if(tx>-2.7)wp.push([LANE,ty],[tx,ty]);
  else if(p){const ey=p[0][1]+.5;wp.push([LANE,ey],[-8.6,ey],...p.map(([x,y])=>[x+.5,y+.5]),[tx,ty]);}
  else wp.push([LANE,ty],[-8.6,ty],[tx,ty]);
  v.trip=wp;v.wp=wp.slice();
}
function goHome(v){
  if(v.k=='fire'){v.wp=[[v.home.x+1.5,v.home.y+1.5]];v.state='back';return;}
  const dp=nearDepot(v.y);v.wp=[...(v.trip||[]).slice(0,-1).reverse(),[LANE,dp],[-1.2,dp+rnd(-.6,.6)]];v.trip=null;v.state='back';
}
function vArrive(v){
  if(v.state=='back'){v.state='idle';return;}
  if(v.state=='garage'){v.state='fix';v.timer=8;return;}
  if(v.state!='go')return;
  if(v.k=='fire'){v.state='work';v.timer=VK.fire.t;return;}
  const f=v.f;if(!f||f.state=='gone'){v.f=null;goHome(v);return;}
  if(v.k=='bus'&&v.phase=='pick'){v.state='load';v.timer=4;return;}
  v.state='work';v.timer=VK[v.k].t;
}
function vDone(v){
  if(v.state=='fix'){const c=Math.round((100-v.cond)*6);S.money-=c;v.cond=100;floatTxt(v.x,v.y,30,'🔧 -€'+c,'#ff8a8a');goHome(v);return;}
  if(v.k=='fire'){const i=v.inc;v.inc=null;if(i&&S.inc.includes(i))endInc(i);goHome(v);return;}
  const f=v.f;
  if(v.state=='load'){if(!f||f.state=='gone'){v.f=null;goHome(v);return;}v.phase='drop';v.state='go';const[tx,ty]=vTarget(f.plane,'bus');pathTo(v,tx,ty,f.stand);return;}
  if(f&&f.state!='gone'){f.done[v.k]=true;floatTxt(v.x,v.y,30,VK[v.k].e+' klaar','#f4c84a');}
  v.f=null;v.cond=Math.max(0,v.cond-rnd(3,6));
  if(v.cond<=0){v.state='broken';v.brokeAt=S.min;toast(`💥 Een ${VK[v.k].n.toLowerCase()} is kapot!`+(garage()?' De garage sleept hem weg.':' Herstel hem bij 🚚 Afhandeling of bouw een 🔧 garage.'));return;}
  goHome(v);
}
function updVeh(v,dt){
  if(v.state=='broken')return;
  if(v.wp.length){const[tx,ty]=v.wp[0],dx=tx-v.x,dy=ty-v.y,d=Math.hypot(dx,dy),st=(v.k=='fire'?5:3.5)*(v.cond<25?.55:1)*dt;if(d>1e-3)v.dir=[dx/d,dy/d];
    if(d<=st){v.x=tx;v.y=ty;v.wp.shift();if(!v.wp.length)vArrive(v);}else{v.x+=dx/d*st;v.y+=dy/d*st;}return;}
  if(v.state=='work'||v.state=='load'||v.state=='fix'){v.timer-=dt;if(v.timer<=0)vDone(v);return;}
  if(v.state!='idle')return;
  if(v.k=='fire'){const i=S.inc.find(i=>!i.truck);if(i){i.truck=v;v.inc=i;v.state='go';v.wp=[[i.pl.x+.8,i.pl.y+1.4]];}return;}
  if(freeDrivers()<=0)return;
  const gar=garage();
  if(gar&&v.cond<45){v.state='garage';pathTo(v,gar.x+1.5,gar.y+1.5);return;}
  S.jobs=S.jobs.filter(j=>j.f.state!='gone'&&!j.f.done[j.k]);
  const ji=S.jobs.findIndex(j=>j.k==v.k&&(j.k!='bus'||j.f.state=='boarding')&&j.f.plane.state=='parked');if(ji<0)return;
  const f=S.jobs.splice(ji,1)[0].f;v.f=f;v.state='go';
  if(v.k=='bus'){v.phase='pick';pathTo(v,LANE,f.gate.y+1.5);}
  else{const[tx,ty]=vTarget(f.plane,v.k);pathTo(v,tx,ty,f.stand);}
}

/* ================= airlines & contracts ================= */
const AIRL=[{n:'Belgavia',c:'BV',col:'#c0392b'},{n:'SkyBudget',c:'SB',col:'#f1c40f'},{n:'Noordwind',c:'NW',col:'#2980b9'},{n:'Iberwing',c:'IW',col:'#e67e22'},
  {n:'Alpenflug',c:'AF',col:'#16a085'},{n:'Sahara Sky',c:'SY',col:'#d35400'},{n:'Atlantica',c:'AT',col:'#34495e'},{n:'Orient Wings',c:'OW',col:'#8e44ad'}];
function genOffer(){
  const pt=pick(Object.keys(PT).filter(k=>S.level>=PT[k].lv)),t=PT[pt],hang=S.level>=6&&Math.random()<.3;
  const fee=(pt=='S'?ri(5,10):pt=='M'?ri(8,14):ri(12,20))+(hang?6:0);
  return{id:S.oid++,al:ri(0,AIRL.length-1),no:ri(100,999),dest:pick(DESTS),pt,dep:ri(14,44)*30,fee,bonus:Math.round(fee*t.pax*4/50)*50,pen:t.pax*8,
    rep:Math.min(80,ri(20,40)+(pt=='M'?10:pt=='L'?25:0)),hang,sat:100,last:-1};
}
function refreshOffers(){S.offers=S.offers.slice(-2);while(S.offers.length<4)S.offers.push(genOffer());}
function signOffer(id){
  const i=S.offers.findIndex(o=>o.id==id);if(i<0)return;const o=S.offers[i],al=AIRL[o.al];
  if(S.rep<o.rep){toast(`⭐ ${al.n} wil minstens ${o.rep}% reputatie (je hebt ${Math.round(S.rep)}%)`);return;}
  if(o.pt=='L'&&!hasFire()){toast('🚒 Voor grote vliegtuigen heb je een brandweerkazerne nodig (🛬 Platform)');return;}
  if(o.hang&&S.objs.filter(x=>x.type=='hangar').length<=S.contracts.filter(c=>c.hang).length){toast(`🏗️ ${al.n} wil een eigen hangar — bouw er een bij 🛬 Platform`);return;}
  const day=Math.floor(S.min/1440);S.offers.splice(i,1);o.last=S.min%1440>=o.dep-150?day:-1;S.contracts.push(o);S.money+=o.bonus;addXP(5);
  toast(`🤝 Contract met ${al.n}: elke dag ${al.c}${o.no} naar ${o.dest} om ${fmtT(o.dep)} · bonus +${eur(o.bonus)}`);
  const big=Math.max(0,...S.objs.filter(isGate).map(g=>GATECAP[g.lv||1]));
  if(big<PT[o.pt].pax)setTimeout(()=>toast(`⚠️ Je hebt nog geen gate ${'★'.repeat(PT[o.pt].sc)} voor dit toestel — upgrade er een!`),1200);
  saveGame();
}
function endContract(id){const i=S.contracts.findIndex(c=>c.id==id);if(i<0)return;const c=S.contracts[i];S.contracts.splice(i,1);S.rep-=3;toast(`📄 Contract met ${AIRL[c.al].n} opgezegd (−3% reputatie)`);}
function moveContract(id,d){const c=S.contracts.find(c=>c.id==id);if(c)c.dep=Math.max(360,Math.min(1380,c.dep+d));}
function satCheck(c){c.sat=Math.max(0,Math.min(100,c.sat));if(c.sat<=0&&S.contracts.includes(c)){S.contracts.splice(S.contracts.indexOf(c),1);S.rep-=4;toast(`💔 ${AIRL[c.al].n} zegt het contract op: te veel problemen`);}}
function contractMiss(c,why){S.money-=c.pen*2;c.sat-=25;S.rep-=2;S.stats.div=(S.stats.div||0)+1;toast(`❌ ${AIRL[c.al].c}${c.no} (${AIRL[c.al].n}) kon niet landen: ${why}. Boete ${eur(c.pen*2)}`);satCheck(c);}
function reservedSoon(){const tod=S.min%1440,day=Math.floor(S.min/1440);return S.contracts.filter(c=>c.last!=day&&c.dep-150>=tod&&c.dep-150-tod<170).length;}
function spawnContracts(){const tod=S.min%1440,day=Math.floor(S.min/1440);for(const c of S.contracts.slice())if(c.last!=day&&tod>=c.dep-150){c.last=day;if(tod<c.dep-20)newFlight(c);}}
function peakLoad(){let m=0;for(const a of S.contracts){const n=S.contracts.filter(b=>Math.abs(b.dep-a.dep)<155).length;if(n>m)m=n;}return m;}

function checkGoals(){GOALS.forEach((g,i)=>{if(!S.goals[i]&&g.ok()){S.goals[i]=true;S.money+=g.r;addXP(Math.round(g.r/100));toast(`🎯 Doel gehaald: ${g.t} (+€${g.r})`);}});}
function alerts(){
  const a=[];
  for(const o of S.objs){const t=TYPES[o.type];if(t.staff&&!o.staff)a.push(`${t.e} ${t.n} heeft geen ${STAFF[t.staff].n.toLowerCase()}`);if(o.type=='toilet'&&o.dirt>6)a.push('🤢 Vieze toiletten — schoonmaker nodig');}

  if(S.jobs.length&&freeDrivers()<=0)a.push('👷 Te weinig chauffeurs: voertuigen staan stil');
  {const br=S.veh.filter(v=>v.state=='broken').length;if(br)a.push(`💥 ${br} voertuig(en) kapot`);}
  for(const o of S.objs)if(o.type=='stand'&&!standOK(o))a.push(`🅿️ Parking P${o.num} is niet met een taxibaan verbonden`);
  if(S.objs.some(o=>o.type=='stand')&&!S.objs.some(o=>o.type=='busgate'))a.push('🚌 Bouw een busgate in de terminal voor je vliegtuigparkings');
  if(S.objs.some(o=>o.type=='busgate')&&!S.veh.some(v=>v.k=='bus'))a.push('🚌 Koop een platformbus voor je busgate');
  if(S.rw2&&!connPath())a.push('🛬 Baan 2 is niet verbonden: leg een taxibaan naar baan 1');
  {const big=Math.max(0,...S.objs.filter(isGate).map(g=>GATECAP[g.lv||1]));for(const c of S.contracts)if(PT[c.pt].pax>big){a.push(`🤝 ${AIRL[c.al].n} vliegt met ${PT[c.pt].adj} toestellen: je hebt een gate ${'★'.repeat(PT[c.pt].sc)} nodig`);break;}
   const cap=placesTotal(),pk=peakLoad();if(pk>cap)a.push(`🤝 Op het drukste moment heb je ${pk} vliegtuigplaatsen nodig, je hebt er ${cap}`);}
  return a;
}

/* ================= main step ================= */
function step(dt){
  S.min+=dt*1.5;
  const day=Math.floor(S.min/1440);
  if(day!=S.day){S.day=day;let sal=S.drivers*DRV_SAL+S.veh.filter(v=>v.k!='fire').length*VUPK+S.objs.filter(o=>o.type=='fire').length*FIRE_SAL;for(const s of S.staff)sal+=STAFF[s.kind].sal;
    const int=Math.round(S.loan*.01),upk=S.objs.reduce((a,o)=>a+Math.round(TYPES[o.type].c*.02*(o.lv||1)),0),rent=S.objs.filter(o=>o.type=='hangar').length*HANGAR_RENT;
    S.money+=rent-sal-int-upk;refreshOffers();toast(`🌙 Dag ${day+1} — lonen €${sal} + onderhoud €${upk}`+(int?` + rente €${int}`:'')+(rent?` · hangarhuur +€${rent}`:'')+' · 📨 nieuwe airline-aanbiedingen');}
  spawnContracts();
  if(S.min>=S.nextFlight){const tod=S.min%1440;if(tod>=300&&tod<1380){newFlight();S.nextFlight=S.min+Math.max(22,80-S.rep*.45-(S.level-1)*3)*rnd(.7,1.3)*(1+S.contracts.length*.12);}else S.nextFlight=S.min+20;}
  for(const i of S.inc.slice())if(S.min>=i.until)endInc(i);
  if(S.repairEnd&&S.min<S.repairEnd)S.runway=S.repairFrom+(100-S.repairFrom)*Math.min(1,(S.min-S.repairStart)/45);else if(S.repairEnd&&S.min>=S.repairEnd){S.runway=100;S.repairEnd=0;toast('✅ Onderhoud landingsbaan klaar');}
  updFlights();
  for(const pl of S.planes)updPlane(pl,dt);
  for(const v of S.veh)updVeh(v,dt);
  {const gar=garage();if(gar)for(const v of S.veh)if(v.state=='broken'&&S.min-(v.brokeAt||0)>30){v.x=gar.x+1.5;v.y=gar.y+1.5;v.wp=[];v.trip=[[LANE,v.y],[-8.6,v.y],[v.x,v.y]];v.state='fix';v.timer=8;}}
  S.planes=S.planes.filter(p=>!p.done&&p.alpha>0);
  for(const o of S.objs)o.incoming=0;
  for(const p of S.pax)if(p.state=='walk'&&p.target)p.target.incoming++;
  for(const o of S.objs){
    const t=TYPES[o.type];if(!t.svc)continue;
    const cap=t.staff?(o.staffed?1:0):SLOTS[o.type].length;
    while(o.serving.length<cap&&o.queue.length){const used=o.serving.map(s=>s.slot);let sl=0;while(used.includes(sl))sl++;const p=o.queue.shift();o.serving.push({p,t:0,slot:sl});p.state='serve';const q=L(o,...SLOTS[o.type][sl]);p.x=q[0];p.y=q[1];}
    for(const s of o.serving.slice()){s.t+=dt;if(s.t>=svcTime(o)){o.serving.splice(o.serving.indexOf(s),1);serve(o,s.p);}}
    if(o.queue.length){const a=acc(o),d=D[o.dir];o.queue.forEach((p,i)=>{p.x=a[0]+.5+d[0]*i*.36;p.y=a[1]+.5+d[1]*i*.36;});}
  }
  for(const p of S.pax.slice())if(!p.gone)updPax(p,dt);
  S.pax=S.pax.filter(p=>!p.gone);
  for(const s of S.staff)updStaff(s,dt);
  S.rep=Math.max(0,Math.min(100,S.rep));
  if((S.goalT=(S.goalT||0)+dt)>1){S.goalT=0;checkGoals();}
  if(S.money<-5000&&!S.over){S.over=true;clearSave();showModal(`<h1>💥 Failliet!</h1><p>Je luchthaven ging bankroet op dag ${S.day+1}.</p><p>${S.stats.boarded} passagiers vlogen met jou mee.</p><button class="b go" style="width:100%" onclick="restart()">Opnieuw beginnen</button>`);}
}

/* ================= init ================= */
function init(sv){
  S={terms:[true,false,false],runway:100,rwLv:1,repairEnd:0,veh:[],jobs:[],inc:[],drivers:0,contracts:[],offers:[],oid:1,rw2:false,standNo:0,airV:1,xp:0,level:1,plots:[false,false,false,false],money:10000,rep:50,min:360,day:0,speed:1,objs:[],pax:[],staff:[],flights:[],planes:[],floats:[],reviews:[],goals:[],loan:0,nextFlight:368,nid:1,gateNo:0,fc:0,lastAngry:-999,over:false,stats:{boarded:0,missed:0,angry:0,shop:0},ghost:null};
  S.grid=[...Array(GH)].map(()=>Array(GW).fill(null));
  S.litter=[...Array(GH)].map(()=>Array(GW).fill(0));
  S.ag=[...Array(GH)].map(()=>Array(ZW).fill(null));
  if(sv&&sv.rw2)setRw2();
  if(sv&&sv.v==1){sv.objs.forEach(o=>o.y+=8);if(sv.litter)sv.litter=[...Array(8)].map(()=>Array(GW).fill(0)).concat(sv.litter,[...Array(8)].map(()=>Array(GW).fill(0)));}
  if(sv&&sv.plots)S.plots=sv.plots.slice();
  if(sv&&sv.terms)S.terms=sv.terms.slice();
  setOwned();recompute();
  if(sv){
    for(const k of['money','rep','min','day','reviews','goals','loan','gateNo','fc','xp','level','runway','rwLv','contracts','offers','oid'])if(sv[k]!==undefined)S[k]=sv[k];
    Object.assign(S.stats,sv.stats||{});if(sv.litter)sv.litter.forEach((r,y)=>{if(y<GH&&Array.isArray(r))r.forEach((v,x)=>{if(x<GW)S.litter[y][x]=+v||0;});});
    for(const o of sv.objs||[]){if(place(o.t,o.x,o.y,o.d,true)){const n=S.objs[S.objs.length-1];if(o.n)n.num=o.n;n.dirt=o.dirt||0;n.lv=o.lv||1;}}
    if(sv.xp===undefined){S.xp=S.stats.boarded;while(S.level<MAXLV&&S.xp>=XPN(S.level+1))S.level++;}
    S.gateNo=Math.max(S.gateNo,sv.gateNo||0);S.standNo=Math.max(S.standNo,sv.standNo||0);
    for(const k of sv.staff||[])hire(k);
    if(sv.veh)for(const v of sv.veh)S.veh.push(newVeh(v.k,null,v.c));
    else{for(let i=0;i<(sv.trucks===undefined?1:sv.trucks);i++)S.veh.push(newVeh('fuel'));S.veh.push(newVeh('bag'));if(S.level>=VK.cater.lv)S.veh.push(newVeh('cater'));}
    S.drivers=sv.drivers!==undefined?sv.drivers:S.veh.filter(v=>v.k!='fire').length;
    for(const c of S.contracts)c.last=Math.floor(S.min/1440)-(S.min%1440>=c.dep-150?0:1);
    if(!S.offers.length)refreshOffers();
    S.nextFlight=S.min+8;
  }else{
  place('checkin',15,18,0,true);

/* ================= UI ================= */
const fmtT=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');};
const eur=v=>(v<0?'-€':'€')+Math.abs(Math.round(v)).toLocaleString('nl-BE');
function toast(msg){const b=$('toast'),d=document.createElement('div');d.textContent=msg;b.appendChild(d);while(b.children.length>2)b.firstChild.remove();setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),500);},3800);}
function updHud(){
  $('money').textContent=eur(S.money);$('money').style.color=S.money<0?'#ff6b6b':'#fff';
  $('rep').textContent=Math.round(S.rep)+'%';$('boarded').textContent=S.stats.boarded;
  $('clock').textContent='Dag '+(S.day+1)+' · '+fmtT(S.min);

  const nx=S.flights.filter(f=>f.state!='gone').sort((a,b)=>a.dep-b.dep)[0];
  $('nextTxt').textContent=nx?(()=>{const m=Math.max(0,nx.dep-S.min);return Math.floor(m/60)+':'+String(Math.floor(m%60)).padStart(2,'0');})():'–';
  $('starTxt').textContent=S.reviews.length?avgStars().toFixed(1):'–';

  $('rwTxt').textContent=(S.min<S.repairEnd?'🚧 ':'')+Math.round(S.runway)+'%';$('rwTxt').style.color=S.runway<35?'#ff6b6b':S.runway<60?'#f4c84a':'#fff';
  $('lvlTxt').textContent='Lvl '+S.level;$('lvlBar').style.width=(S.level>=MAXLV?100:Math.max(0,Math.min(100,(S.xp-XPN(S.level))/(XPN(S.level+1)-XPN(S.level))*100)))+'%';
}

  return`<h3>${title}</h3><div class="items">${its.map(([k,t])=>{const lk=S.level<lockLv(k);return`<div class="item ${buildSel==k?'sel':''} ${S.money<t.c||lk?'poor':''}" data-a="sel" data-t="${k}"><div class="e">${lk?'🔒':t.e}</div><div class="n">${t.n}<br><small style="color:#aeb8c6">${t.sz}×${t.sz}</small></div><div class="p" ${lk?'style="color:#f4c84a"':''}>${lk?'Level '+lockLv(k):'€'+t.c.toLocaleString('nl-BE')}</div></div>`;}).join('')}</div>

    <div class="hint">${sel?(S.ghost&&S.ghost.err?'⚠️ '+S.ghost.err:(sel.d?sel.d+' ':'')+(buildSel=='taxi'?'Tik op een vakje van het platformterrein om meteen een stuk taxibaan te leggen; tik verder om door te trekken.':air?'Tik op het groene platformterrein links van de landingsbaan voor een voorbeeld, en tik nog eens (of op ✔) om te bouwen.':'Tik op de vloer voor een voorbeeld, en tik nog eens (of op ✔) om te bouwen. Geel vakje = ingang.')+(sel.earn?` Levert €${sel.earn} per klant.`:'')+(canUpg({type:buildSel})?' Later te upgraden tot ★★★.':'')):'Kies wat je wil bouwen.'}</div>`;

function onTap(cx,cy){
  const wx=cx/cam.s+cam.x,wy=cy/cam.s+cam.y,a=wx/(TW/2),b=wy/(TH/2),tx=Math.floor((a+b)/2),ty=Math.floor((b-a)/2);
  if(buildSel=='taxi'){const err=canPlace('taxi',tx,ty,0);if(err)toast('⚠️ '+err);else place('taxi',tx,ty,0,false);S.ghost=null;renderPanel();return;}
  if(buildSel){
    const[x,y]=anchor(buildSel,tx,ty),g=S.ghost,dir=buildSel=='gate'?3:buildDir;
    if(g&&!g.sell&&g.type==buildSel&&g.x==x&&g.y==y&&g.dir==dir){if(!g.err&&place(g.type,x,y,dir,false))S.ghost=null;else if(g.err)toast('⚠️ '+g.err);}
    else S.ghost={type:buildSel,x,y,dir,err:canPlace(buildSel,x,y,dir)};
    renderPanel();return;
  }
  if(kind(tx,ty)=='floor'&&!owned(ty)){const i=plotAt(ty);panel=null;setPanel('grond');if(i>=0&&plotBuyable(i))toast(`🏷️ ${PLOTS[i].n} te koop voor €${PLOTS[i].c.toLocaleString('nl-BE')}`);return;}
  let o=inZone(tx,ty)?agAt(tx,ty):S.grid[ty]&&S.grid[ty][tx];if(o===RW2TILE)o=null;
  if(panel=='sloop'){if(o){if(S.ghost&&S.ghost.sell===o){sell(o);S.ghost=null;}else S.ghost={sell:o};}else S.ghost=null;renderPanel();return;}
  if(o){S.sel=o;panel='obj';buildSel=null;S.ghost=null;renderPanel();}
}

/* ================= camera & input ================= */
const BND={x0:P(ZX0-3,GH+2)[0],x1:P(GW+8,0)[0],y0:P(ZX0-3,0)[1]-120,y1:P(GW,GH)[1]+60};
function resize(){DPR=Math.min(2.5,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;clampCam();}
function fitCam(){
  const hud=$('hud').getBoundingClientRect().bottom+8,bar=$('bar').offsetHeight+8,aw=W-16,ah=Math.max(120,H-hud-bar);
  const x0=P(AX-4,S.oy1)[0],x1=P(GW+1,S.oy0)[0],y0=P(AX-4,S.oy0)[1]-70,y1=P(GW+1,S.oy1)[1]+10;
  let s=Math.min(aw/(x1-x0),ah/(y1-y0));
  if(W<H)s=Math.max(.55,s);
  cam.s=Math.max(.3,Math.min(1.1,s));
  const cx=W<H?P((AX+GW)/2+1.5,(S.oy0+S.oy1)/2)[0]:(x0+x1)/2,cy=W<H?P((AX+GW)/2+1.5,(S.oy0+S.oy1)/2)[1]:(y0+y1)/2;
  cam.x=cx-W/2/cam.s;cam.y=cy-(hud+ah/2)/cam.s;clampCam();
}
function focusZone(keep){const c=P((ZX0+ZX1)/2,(S.oy0+S.oy1)/2);cam.x=c[0]-W/2/cam.s;cam.y=c[1]-(keep&&W<760?H*.3:H/2)/cam.s;clampCam();if(!keep&&(W<760||H<520)){panel=null;renderPanel();}}
function focusTerm(i){const[r0,r1]=termRange(i),c=P((AX+GW)/2,(r0+r1)/2);cam.x=c[0]-W/2/cam.s;cam.y=c[1]-H/2/cam.s;clampCam();if(W<760||H<520){panel=null;renderPanel();}}
function clampCam(){cam.s=Math.max(.3,Math.min(2.2,cam.s));const cx=cam.x+W/2/cam.s,cy=cam.y+H/2/cam.s;cam.x=Math.max(BND.x0,Math.min(BND.x1,cx))-W/2/cam.s;cam.y=Math.max(BND.y0,Math.min(BND.y1,cy))-H/2/cam.s;}
const ptrs=new Map();let gest=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size==1)gest={type:'tap',sx:e.clientX,sy:e.clientY};else if(ptrs.size==2){const[a,b]=[...ptrs.values()];gest={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),s0:cam.s};}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p||!gest)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(gest.type=='pinch'&&ptrs.size==2){const[a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,wx=mx/cam.s+cam.x,wy=my/cam.s+cam.y;cam.s=Math.max(.3,Math.min(2.2,gest.s0*Math.hypot(a.x-b.x,a.y-b.y)/gest.d0));cam.x=wx-mx/cam.s;cam.y=wy-my/cam.s;clampCam();return;}
  if(gest.type=='tap'&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>9)gest.type='pan';
  if(gest.type=='pan'){cam.x-=dx/cam.s;cam.y-=dy/cam.s;clampCam();}});
function up(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(gest&&gest.type=='tap'&&!ptrs.size)onTap(e.clientX,e.clientY);if(!ptrs.size)gest=null;else if(gest&&gest.type=='pinch')gest={type:'pan'};}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(!ptrs.size)gest=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();const wx=e.clientX/cam.s+cam.x,wy=e.clientY/cam.s+cam.y;cam.s*=e.deltaY<0?1.1:.9;cam.s=Math.max(.3,Math.min(2.2,cam.s));cam.x=wx-e.clientX/cam.s;cam.y=wy-e.clientY/cam.s;clampCam();},{passive:false});

  if(!S.over&&S.speed>0&&$('modal').style.display=='none'){let sim=rdt*S.speed;while(sim>1e-6){const d=Math.min(.05,sim);step(d);sim-=d;}}
  for(const c of S.cars){c.y+=c.v*c.sp*rdt;if(c.y>GH+16)c.y=-16;if(c.y<-16)c.y=GH+16;}
  for(const f of S.floats)f.t+=rdt;S.floats=S.floats.filter(f=>f.t<1.5);
  if((saveT+=rdt)>15){saveT=0;if($('modal').style.display=='none')saveGame();}
  draw();uiT+=rdt;if(uiT>.3){uiT=0;updHud();if(['staff','flights','stars','goals','alerts','bank','grond','obj','level','platform','veh','airlines'].includes(panel))renderPanel();}
  requestAnimationFrame(frame);
}
